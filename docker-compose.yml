services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ORIGIN: https://${DOMAIN}
    volumes:
      - tindify-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  tindify-data:
  caddy-data:
