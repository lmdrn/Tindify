<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Tindify</title>
		<style>
			* { border-radius: 0; box-sizing: border-box; }
			html, body { margin: 0; height: 100%; }
			body {
				background-color: #ecece8;
				background-image: linear-gradient(#9a9a95 2px, transparent 2px), linear-gradient(90deg, #9a9a95 2px, transparent 2px);
				background-size: 32px 32px;
				color: #0d0d0c;
				font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 24px max(16px, env(safe-area-inset-left, 0px));
			}
			.board { background: #f6f6f2; border: 1px solid #0d0d0c; box-shadow: 6px 6px 0 rgba(13, 13, 12, 0.18); padding: 26px; max-width: 640px; }
			.code { font: 900 clamp(110px, 20vw, 240px) / 0.8 Impact, 'Arial Narrow', sans-serif; color: #b8000f; margin: 0 0 12px; }
			h1 { font: 900 clamp(34px, 5vw, 60px) / 0.95 Impact, 'Arial Narrow', sans-serif; text-transform: uppercase; margin: 0 0 12px; }
			p { margin: 0 0 18px; }
			a { display: inline-block; background: #8e000e; color: #fff; text-decoration: none; padding: 12px 18px; text-transform: uppercase; letter-spacing: 0.14em; font-size: 13px; font-weight: 600; }
		</style>
	</head>
	<body>
		<div class="board">
			<div class="code">%sveltekit.status%</div>
			<h1>Bassin fermé pour vidange.</h1>
			<p>Erreur de notre côté. Réessaie dans un moment. · Something broke on our side. Try again in a moment.</p>
			<a href="/">Retour au bassin</a>
		</div>
	</body>
</html>
